[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdlaw"
dynamic = ["version"]
description = "Blazing-fast unofficial MyDramaList API wrapper (FastAPI + httpx, official MDL Android app API)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pandamoon21" }]
keywords = ["mydramalist", "mdl", "drama", "k-drama", "api", "wrapper", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "curl_cffi>=0.16",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/pandamoon21/MDL-API-Wrapper"
Changelog = "https://github.com/pandamoon21/MDL-API-Wrapper/blob/main/CHANGELOG.md"
Issues = "https://github.com/pandamoon21/MDL-API-Wrapper/issues"

[project.scripts]
mdlaw = "mdlaw:main"

[tool.setuptools]
packages = ["mdlaw"]

[tool.setuptools.package-data]
mdlaw = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "mdlaw._config.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
# Explicit, so results don't change when a newer ruff widens its defaults.
select = ["E4", "E7", "E9", "F"]
