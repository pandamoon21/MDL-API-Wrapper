name: ci

# Manual only: this workflow never runs on push / pull_request.
# Trigger it from the Actions tab ("Run workflow") or `gh workflow run ci`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff==0.17.4

      - name: Lint
        run: ruff check mdlaw.py tests/

      - name: Offline self-check
        run: python mdlaw.py self

      - name: Tests (offline)
        run: python -m pytest tests/ -q
